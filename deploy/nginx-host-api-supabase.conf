# =====================================================================
# Proxy reverso do HOST para a API do Supabase self-hosted
#   https://api.quadrodossonhos.antonellaroweder.com.br
#
#   sudo cp deploy/nginx-host-api-supabase.conf \
#           /etc/nginx/sites-available/api-quadrodossonhos.conf
#   sudo ln -s /etc/nginx/sites-available/api-quadrodossonhos.conf \
#              /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d api.quadrodossonhos.antonellaroweder.com.br
#   sudo nginx -t && sudo systemctl reload nginx
#
# Server block NOVO — não encosta no AtendimentoPRO nem em nenhum outro site.
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.quadrodossonhos.antonellaroweder.com.br;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.quadrodossonhos.antonellaroweder.com.br;

    ssl_certificate     /etc/letsencrypt/live/api.quadrodossonhos.antonellaroweder.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.quadrodossonhos.antonellaroweder.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WeDreamApiSSL:10m;

    server_tokens off;

    # As fotos dos sonhos passam por aqui (o app comprime antes de enviar,
    # mas deixamos folga).
    client_max_body_size 25m;

    access_log /var/log/nginx/api-quadrodossonhos.access.log;
    error_log  /var/log/nginx/api-quadrodossonhos.error.log;

    location / {
        # 8000 = API_GW_HTTP_PORT do supabase-selfhost/.env
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Realtime usa WebSocket
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # uploads e downloads grandes não podem ser bufferizados
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# Necessário para o WebSocket do Realtime. Se este mapa já existir em outro
# arquivo do seu nginx (http block), remova estas linhas para não duplicar.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
