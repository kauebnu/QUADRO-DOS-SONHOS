# =====================================================================
# Proxy reverso do HOST para a API do Supabase do WE DREAM
#   https://api.quadrodossonhos.antonellaroweder.com.br
#
# Mesmo padrão do aulingo nesta VPS: o nginx faz o papel do gateway,
# encaminhando cada prefixo para o serviço certo.
#
#   /auth/v1/     → 127.0.0.1:4001   cadastro e login (GoTrue)
#   /rest/v1/     → 127.0.0.1:4002   consultas (PostgREST)
#   /storage/v1/  → 127.0.0.1:4003   fotos dos sonhos
#
#   sudo cp deploy/nginx-host-api-supabase.conf \
#           /etc/nginx/sites-available/api-quadrodossonhos.conf
#   sudo ln -s /etc/nginx/sites-available/api-quadrodossonhos.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.quadrodossonhos.antonellaroweder.com.br
#
# Server block NOVO — não encosta no AtendimentoPRO, na Evolution API,
# no aulingo nem no rachajusto.
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.quadrodossonhos.antonellaroweder.com.br;

    # o certbot reescreve este bloco para redirecionar ao HTTPS;
    # até lá, deixe-o servir para a validação do certificado
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # ------------------------------------------------- cadastro e login
    location /auth/v1/ {
        proxy_pass http://127.0.0.1:4001/;
        include /etc/nginx/wedream-proxy-comum.conf;
    }

    # ------------------------------------------------------- consultas
    location /rest/v1/ {
        proxy_pass http://127.0.0.1:4002/;
        include /etc/nginx/wedream-proxy-comum.conf;
    }

    # -------------------------------------------------- fotos dos sonhos
    location /storage/v1/ {
        proxy_pass http://127.0.0.1:4003/;
        include /etc/nginx/wedream-proxy-comum.conf;

        # upload e download sem bufferizar: fotos podem ser grandes
        client_max_body_size    25m;
        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_read_timeout      300s;
        proxy_send_timeout      300s;
    }

    # Nada mais é exposto. O banco (5434) nunca sai da VPS.
    location / {
        return 404 '{"erro":"rota inexistente"}';
        default_type application/json;
    }
}
