# =====================================================================
# nginx DENTRO do container do WE DREAM.
# O TLS e o domínio ficam no proxy reverso do host — veja
# deploy/nginx-host-quadrodossonhos.conf
# =====================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Estamos atrás de um proxy: o IP real vem no cabeçalho
    real_ip_header X-Forwarded-For;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;

    # ------------------------------------------------------- compressão
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/manifest+json image/svg+xml
        font/woff2 application/wasm;

    # ------------------------------------------------------- health check
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true,"servico":"we-dream-web"}';
    }

    # ---------------------------------------------- arquivos com hash no nome
    location /assets/ {
        include /etc/nginx/wedream-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /icons/ {
        include /etc/nginx/wedream-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # ------------------------------------- nunca cachear: config e service worker
    location = /config.js {
        include /etc/nginx/wedream-security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        default_type application/javascript;
        try_files $uri =404;
    }

    location = /sw.js {
        include /etc/nginx/wedream-security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/wedream-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # ------------------------------------------------- SPA: tudo cai no index
    # O HTML nunca é cacheado, senão o celular fica preso numa versão antiga.
    location / {
        include /etc/nginx/wedream-security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # arquivos ocultos ficam fora
    location ~ /\. {
        deny all;
    }
}
