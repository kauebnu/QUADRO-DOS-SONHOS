# =====================================================================
# Proxy reverso do HOST (a VPS da Contabo) para
#   https://quadrodossonhos.antonellaroweder.com.br
#
# Copie para /etc/nginx/sites-available/quadrodossonhos.conf e ative:
#   sudo ln -s /etc/nginx/sites-available/quadrodossonhos.conf \
#              /etc/nginx/sites-enabled/quadrodossonhos.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Este arquivo cria um server block NOVO. Nenhum dos seus outros
# projetos é tocado — cada um continua no server block dele.
#
# Se a sua VPS usa Traefik/Caddy em vez de nginx, veja o final de
# deploy/DEPLOY-CONTABO.md.
#
# A linha abaixo é o marcador que o instalador procura para saber que
# este arquivo é nosso e pode ser substituído. Não remova.
#   we-dream
# =====================================================================

# ---------------------------------------------------- HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name quadrodossonhos.antonellaroweder.com.br;

    # deixa o certbot validar o domínio
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------- HTTPS
server {
    # HTTP/2 na sintaxe antiga, de propósito: `http2 on;` só existe a
    # partir do nginx 1.25.1, e o Ubuntu 24.04 traz o 1.24.0 — lá a
    # diretiva é recusada e o nginx REJEITA A CONFIGURAÇÃO INTEIRA
    # ("unknown directive http2"), derrubando também os outros sites.
    # Esta forma funciona nas duas versões (no 1.25+ apenas avisa).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quadrodossonhos.antonellaroweder.com.br;

    # Certificados criados pelo certbot (veja o guia de deploy)
    ssl_certificate     /etc/letsencrypt/live/quadrodossonhos.antonellaroweder.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quadrodossonhos.antonellaroweder.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:WeDreamSSL:10m;
    ssl_session_timeout 1d;

    # HSTS: só ligue quando o HTTPS estiver funcionando bem
    add_header Strict-Transport-Security "max-age=31536000" always;

    server_tokens off;
    charset utf-8;

    # fotos dos sonhos podem ser grandes
    client_max_body_size 20m;

    access_log /var/log/nginx/quadrodossonhos.access.log;
    error_log  /var/log/nginx/quadrodossonhos.error.log;

    location / {
        # 4000 = WEB_PORT do .env (container we-dream-web)
        proxy_pass http://127.0.0.1:4000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
        proxy_buffering on;
    }

    # ATENÇÃO: o servidor de notificações (porta 4100) NÃO é publicado aqui.
    # Ele usa a chave service_role do Supabase e deve ficar acessível apenas
    # de dentro da VPS.
}
