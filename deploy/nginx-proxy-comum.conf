# Cabeçalhos comuns a todas as rotas da API do WE DREAM.
#
#   sudo cp deploy/nginx-proxy-comum.conf /etc/nginx/wedream-proxy-comum.conf
#
# Fica num arquivo à parte porque cada bloco `location` precisa repeti-los —
# no nginx, o que é definido dentro de um location não herda do de fora.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Limpa X-Forwarded-Path: o serviço de fotos monta os links assinados a
# partir dele. Se alguém enviasse esse cabeçalho de fora, conseguiria
# alterar as URLs geradas.
proxy_set_header X-Forwarded-Path "";

# O CORS é respondido pelos próprios serviços (GoTrue, PostgREST, storage).
# Não acrescente cabeçalhos de CORS aqui: eles duplicariam e o navegador
# recusaria a resposta.

proxy_connect_timeout 10s;
proxy_read_timeout    60s;
proxy_send_timeout    60s;
