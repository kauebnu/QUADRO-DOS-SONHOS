# =====================================================================
# Ajustes do WE DREAM sobre a pilha oficial do Supabase.
#
# O docker-compose.yml ao lado é o arquivo OFICIAL, copiado sem alteração
# (facilita atualizar depois). Tudo que é específico daqui mora neste
# override, que o Docker Compose aplica automaticamente.
#
# Ele faz duas coisas indispensáveis nesta VPS:
#
# 1. RENOMEIA todos os containers para wedream-*.
#    Nome de container é global no Docker. O compose oficial usa
#    "supabase-db", "supabase-auth"… Se o aulingo (ou qualquer outro
#    projeto) já roda um Supabase aqui, os nomes colidem.
#
# 2. PRENDE as portas em 127.0.0.1.
#    O compose oficial publica Postgres (5432), o pooler (6543) e o
#    gateway (8000) em TODAS as interfaces — ou seja, abertos para a
#    internet. Aqui só o proxy reverso do host enxerga.
# =====================================================================

services:
  studio:
    container_name: wedream-supabase-studio

  api-gw:
    container_name: wedream-supabase-envoy
    ports: !override
      - "127.0.0.1:${API_GW_HTTP_PORT:-8000}:8000/tcp"

  auth:
    container_name: wedream-supabase-auth

  rest:
    container_name: wedream-supabase-rest

  realtime:
    container_name: wedream-supabase-realtime

  storage:
    container_name: wedream-supabase-storage

  imgproxy:
    container_name: wedream-supabase-imgproxy

  meta:
    container_name: wedream-supabase-meta

  functions:
    container_name: wedream-supabase-edge-functions

  db:
    container_name: wedream-supabase-db

  supavisor:
    container_name: wedream-supabase-pooler
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
      - "127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION:-6544}:6543"
