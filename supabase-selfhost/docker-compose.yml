# =====================================================================
# Supabase mínimo para o WE DREAM — mesmo padrão do aulingo nesta VPS.
#
# A pilha oficial do Supabase são 11 containers e 3–4 GB de RAM. Esta VPS
# tem 8 GB e já roda AtendimentoPRO, Evolution API, aulingo e rachajusto.
# Aqui ficam só os 4 serviços que o WE DREAM realmente usa (~1 GB):
#
#   db       Postgres com os schemas e papéis do Supabase
#   auth     GoTrue — cadastro e login por e-mail/senha
#   rest     PostgREST — é o que responde às consultas do app
#   storage  fotos dos sonhos, com links assinados
#
# Ficou de fora: Realtime (o app não assina mudanças ao vivo), Edge
# Functions, Supavisor, Analytics, imgproxy (não usamos transformação de
# imagem) e o gateway Envoy — o nginx do host faz esse papel.
#
# O painel visual (Studio) é opcional:
#   docker compose --profile studio up -d
#
# TODAS as portas ficam presas em 127.0.0.1. Só o nginx é público.
# =====================================================================

name: we-dream-supabase

services:
  # ------------------------------------------------------------- banco
  db:
    image: supabase/postgres:17.6.1.136
    container_name: wedream-db
    restart: unless-stopped
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
      - db-data:/var/lib/postgresql/data
      # rodam uma única vez, na criação do banco
      - ./volumes/db/auth-owner.sql:/docker-entrypoint-initdb.d/init-scripts/99-auth-owner.sql:ro
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
    ports:
      # só para psql/backup de dentro da VPS
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: &registro
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------- cadastro e login
  auth:
    image: supabase/gotrue:v2.196.0
    container_name: wedream-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:?defina API_EXTERNAL_URL no .env}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}

      GOTRUE_SITE_URL: ${SITE_URL:?defina SITE_URL no .env}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}

      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}

      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP:-true}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-true}
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"

      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-WE DREAM}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

      GOTRUE_LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${AUTH_PORT:-4001}:9999"
    healthcheck:
      # 127.0.0.1 pelo mesmo motivo do storage: localhost pode cair no ::1
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9999/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging: *registro

  # ------------------------------------------------- consultas do app
  rest:
    image: postgrest/postgrest:v14.17
    container_name: wedream-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      # "storage" precisa entrar aqui: é assim que o serviço de fotos
      # conversa com o banco
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,storage}
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: "*"
    ports:
      - "127.0.0.1:${REST_PORT:-4002}:3000"
    # SEM healthcheck, de propósito: a imagem do PostgREST é distroless —
    # só existe /bin/postgrest lá dentro, sem shell, curl ou wget. Qualquer
    # teste aqui falha com "exec: /bin/sh: no such file or directory" e o
    # container fica eternamente unhealthy mesmo respondendo normalmente.
    # A pilha oficial do Supabase também não define healthcheck para ele.
    # Quem confere se o PostgREST subiu é o instalador, do lado de fora.
    logging: *registro

  # ----------------------------------------------- fotos dos sonhos
  storage:
    image: supabase/storage-api:v1.74.0
    container_name: wedream-storage
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY:?defina ANON_KEY no .env}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?defina SERVICE_ROLE_KEY no .env}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      POSTGREST_URL: http://rest:3000
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}

      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      # O cliente já monta a URL assinada juntando ${SUPABASE_PUBLIC_URL} +
      # /storage/v1 + o caminho devolvido aqui. Se deixássemos o serviço
      # também acrescentar o prefixo (via X-Forwarded-Path), o link sairia
      # com /storage/v1 duas vezes e a foto não abriria. O nginx ainda
      # limpa esse cabeçalho, para ninguém injetá-lo de fora.
      REQUEST_ALLOW_X_FORWARDED_PATH: "false"

      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-52428800}
      TENANT_ID: ${STORAGE_TENANT_ID:-wedream}
      REGION: ${REGION:-sa-east-1}
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET:-dream-images}

      # o app não usa transformação de imagem (ele já comprime a foto no
      # celular antes de enviar), então dispensamos o imgproxy
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - ./volumes/storage:/var/lib/storage:z
    ports:
      - "127.0.0.1:${STORAGE_PORT:-4003}:5000"
    healthcheck:
      # 127.0.0.1 e não localhost: dentro deste container localhost resolve
      # primeiro para ::1 (IPv6) e o serviço escuta só em IPv4 — o teste
      # dava "connection refused" com o storage funcionando perfeitamente.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/status"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging: *registro

  # --------------------------------- painel visual (opcional)
  # sobe só com:  docker compose --profile studio up -d
  meta:
    image: supabase/postgres-meta:v0.99.0
    container_name: wedream-meta
    restart: unless-stopped
    profiles: [studio]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    logging: *registro

  studio:
    image: supabase/studio:2026.09.07-sha-7996410
    container_name: wedream-studio
    restart: unless-stopped
    profiles: [studio]
    depends_on:
      - meta
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION:-Antonella Roweder}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT:-WE DREAM}
      SUPABASE_URL: http://rest:3000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      LOGFLARE_PRIVATE_ACCESS_TOKEN: ""
      NEXT_PUBLIC_ENABLE_LOGS: "false"
    ports:
      # abra um túnel SSH para usar:
      #   ssh -i sua-chave -L 4004:127.0.0.1:4004 root@158.220.116.153
      - "127.0.0.1:${STUDIO_PORT:-4004}:3000"
    logging: *registro

volumes:
  db-data:
    name: we-dream-db-data

networks:
  default:
    name: we-dream-supabase-net
